<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #131720;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 3rem;
      padding: 4rem;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 0;
    }
    svg text {
      font-family: 'Josefin Sans', sans-serif;
    }
    .label {
      font-family: sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .card { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>

  <div class="card">
    <div class="label">Large</div>
    <div class="row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 100" width="580" height="100" fill="none">
        <rect x="3" y="3" width="94" height="94" stroke="white" stroke-width="3"/>
        <circle cx="81.5" cy="21" r="5.5" fill="white"/>
        <line x1="22" y1="53" x2="97" y2="53" stroke="white" stroke-width="3"/>
        <line x1="22" y1="53" x2="22" y2="97" stroke="white" stroke-width="3"/>
        <text x="120" y="71"
          font-family="'Josefin Sans', sans-serif"
          font-weight="300" font-size="44" letter-spacing="7"
          fill="white">CABINET ZONE</text>
      </svg>
    </div>
  </div>

  <div class="card">
    <div class="label">Medium (business card scale)</div>
    <div class="row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 100" width="360" height="62" fill="none">
        <rect x="3" y="3" width="94" height="94" stroke="white" stroke-width="3"/>
        <circle cx="81.5" cy="21" r="5.5" fill="white"/>
        <line x1="22" y1="53" x2="97" y2="53" stroke="white" stroke-width="3"/>
        <line x1="22" y1="53" x2="22" y2="97" stroke="white" stroke-width="3"/>
        <text x="120" y="71"
          font-family="'Josefin Sans', sans-serif"
          font-weight="300" font-size="44" letter-spacing="7"
          fill="white">CABINET ZONE</text>
      </svg>
    </div>
  </div>

  <div class="card">
    <div class="label">Small</div>
    <div class="row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 100" width="220" height="38" fill="none">
        <rect x="3" y="3" width="94" height="94" stroke="white" stroke-width="3"/>
        <circle cx="81.5" cy="21" r="5.5" fill="white"/>
        <line x1="22" y1="53" x2="97" y2="53" stroke="white" stroke-width="3"/>
        <line x1="22" y1="53" x2="22" y2="97" stroke="white" stroke-width="3"/>
        <text x="120" y="71"
          font-family="'Josefin Sans', sans-serif"
          font-weight="300" font-size="44" letter-spacing="7"
          fill="white">CABINET ZONE</text>
      </svg>
    </div>
  </div>

</body>
</html>
