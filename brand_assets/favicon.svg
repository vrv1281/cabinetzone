<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&amp;display=swap');</style>
  </defs>

  <rect width="100" height="100" rx="10" fill="#131720"/>

  <!-- Open square: top + right + bottom only — left side is open (the break) -->
  <path d="M12,10 L92,10 L92,92 L12,92"
        stroke="#c4a882" stroke-width="3.5" fill="none"
        stroke-linejoin="miter" stroke-linecap="square"/>

  <!-- Inner horizontal bar dividing B (top/CABINET) from Z (bottom/ZONE) -->
  <line x1="12" y1="51" x2="92" y2="51"
        stroke="#c4a882" stroke-width="3.5" stroke-linecap="square"/>

  <!-- Circle dot — upper-right, inside the top section -->
  <circle cx="80" cy="28" r="4.5" fill="#c4a882"/>

  <!-- B: left edge at the square's open-left position, baseline sits on inner bar -->
  <text x="12" y="51"
        font-family="'Josefin Sans','Futura','Century Gothic',sans-serif"
        font-weight="300" font-size="46" fill="#c4a882">B</text>

  <!-- Z: left edge at the same position, cap-top touches the inner bar -->
  <text x="12" y="84"
        font-family="'Josefin Sans','Futura','Century Gothic',sans-serif"
        font-weight="300" font-size="46" fill="#c4a882">Z</text>
</svg>
