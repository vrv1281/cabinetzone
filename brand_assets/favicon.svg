<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Square border — bold stroke, no fill (transparent interior) -->
  <rect x="19" y="12" width="64" height="76"
        stroke="#131d35" stroke-width="8" fill="none"/>

  <!-- Hinge — filled solid rectangle overlapping the left edge -->
  <rect x="11" y="33" width="16" height="34"
        fill="#131d35"/>

  <!-- Dot — upper right corner inside the square -->
  <circle cx="71" cy="27" r="6" fill="#131d35"/>

</svg>
