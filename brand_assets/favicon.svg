<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background — no white square, blends cleanly in any browser chrome -->
  <rect width="32" height="32" rx="5" fill="#131720"/>

  <!-- Outer square frame (logo boundary) -->
  <rect x="2.5" y="2.5" width="27" height="27" stroke="#c4a882" stroke-width="1.4" fill="none"/>

  <!-- Circle dot — top-right, mirrors position in full logo mark -->
  <circle cx="25" cy="7.5" r="2" fill="#c4a882"/>

  <!-- Inner L-shape: horizontal line across at mid-height -->
  <line x1="8" y1="17" x2="29.5" y2="17" stroke="#c4a882" stroke-width="1.4"/>

  <!-- Inner L-shape: vertical line down on the left -->
  <line x1="8" y1="17" x2="8" y2="29.5" stroke="#c4a882" stroke-width="1.4"/>
</svg>
