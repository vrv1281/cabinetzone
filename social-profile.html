<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');
  .wrap {
    width: 1080px;
    height: 1080px;
    background: #131720;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .bg-glow-1 {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,168,130,0.10) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .bg-glow-2 {
    position: absolute;
    width: 900px; height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(26,32,48,0.8) 40%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    transform: translateX(-55px);
  }
  .logo { width: 820px; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="content">
    <img class="logo" src="http://localhost:3000/brand_assets/logo_white.png" alt="CabinetZone">
  </div>
</div>
</body>
</html>
