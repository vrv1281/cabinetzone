<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — CabinetZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/site.css" />
  <!-- Production fallback: static photo list generated by node scan-photos.mjs -->
  <script src="/photos-manifest.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 9.5rem 3rem 0;
      position: relative; overflow: hidden;
    }
    .page-header::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 80% 35%, rgba(196,168,130,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 5% 80%, rgba(30,40,70,0.5) 0%, transparent 50%);
      pointer-events: none;
    }
    .page-header-inner { max-width: 1440px; margin: 0 auto; position: relative; z-index: 1; }

    /* ── CATEGORY TABS ── */
    .cat-tabs {
      display: flex;
      border-bottom: 1px solid rgba(196,168,130,0.1);
      margin-top: 3rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      background: none; border: none;
      border-bottom: 2px solid transparent;
      padding: 1rem 2.5rem 1rem 0;
      cursor: pointer; margin-bottom: -1px; white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .cat-tab:hover { color: rgba(255,255,255,0.75); }
    .cat-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── MASONRY ── */
    .masonry-section { padding: 0 3rem 6rem; }
    .count-bar { padding: 1.5rem 0 0.75rem; }
    .count-text { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.22); }

    .masonry-grid { columns: 3; column-gap: 10px; }
    .masonry-item {
      break-inside: avoid; margin-bottom: 10px;
      position: relative; overflow: hidden; cursor: pointer;
    }
    .masonry-item img {
      width: 100%; height: auto; display: block;
      transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .masonry-item:hover img { transform: scale(1.04); }

    /* Project name overlay */
    .m-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(8,12,20,0.88) 0%, rgba(8,12,20,0.2) 45%, transparent 70%);
      opacity: 0; transition: opacity 0.32s ease;
      display: flex; align-items: flex-end;
      padding: 1.125rem 1.25rem;
    }
    .masonry-item:hover .m-overlay { opacity: 1; }
    .m-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.125rem; font-weight: 400; color: #fff; line-height: 1.25;
      transform: translateY(5px);
      transition: transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .masonry-item:hover .m-title { transform: translateY(0); }
    /* Always visible on mobile */
    @media (max-width: 640px) {
      .m-overlay { opacity: 1 !important; }
      .m-title   { transform: none !important; }
    }

    /* ── COMING SOON ── */
    .coming-soon {
      text-align: center;
      padding: 4rem 3rem 5.5rem;
      border-top: 1px solid rgba(196,168,130,0.08);
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(6,9,14,0.97);
      display: none; flex-direction: column;
    }
    #lightbox.open { display: flex; }
    .lb-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.125rem 2rem; flex-shrink: 0;
      border-bottom: 1px solid rgba(196,168,130,0.08);
    }
    .lb-count { font-size: 0.7rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); }
    .lb-close-btn {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(196,168,130,0.2); background: transparent; cursor: pointer;
      color: rgba(255,255,255,0.55); transition: border-color 0.2s, color 0.2s;
    }
    .lb-close-btn:hover { border-color: rgba(196,168,130,0.7); color: #fff; }
    .lb-stage {
      flex: 1; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 5rem;
    }
    #lb-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; user-select: none; }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(196,168,130,0.22); cursor: pointer;
      background: rgba(19,23,32,0.75); backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.65); z-index: 10;
      transition: border-color 0.2s, color 0.2s, opacity 0.2s;
    }
    .lb-nav:hover { border-color: rgba(196,168,130,0.65); color: #fff; }
    .lb-nav.dim { opacity: 0.18; pointer-events: none; }
    #lb-prev { left: 1.25rem; }
    #lb-next { right: 1.25rem; }
    .lb-strip {
      flex-shrink: 0; padding: 0.875rem 2rem;
      border-top: 1px solid rgba(196,168,130,0.07);
      display: flex; gap: 0.5rem; justify-content: center; overflow-x: auto;
    }
    .lb-strip::-webkit-scrollbar { height: 2px; }
    .lb-strip::-webkit-scrollbar-thumb { background: rgba(196,168,130,0.4); }
    .lb-thumb {
      width: 80px; height: 54px; object-fit: cover; flex-shrink: 0; cursor: pointer;
      opacity: 0.32; border: 1px solid transparent; transition: opacity 0.2s, border-color 0.2s;
    }
    .lb-thumb:hover { opacity: 0.68; }
    .lb-thumb.active { opacity: 1; border-color: var(--accent); }

    /* ── MOBILE ── */
    @media (max-width: 1024px) { .masonry-grid { columns: 2; } }
    @media (max-width: 640px) {
      .page-header { padding: 7rem 1.25rem 0; }
      .cat-tab { padding: 0.875rem 1.5rem 0.875rem 0; font-size: 0.65rem; }
      .masonry-section { padding: 0 1.25rem 4rem; }
      .masonry-grid { columns: 1; }
      .coming-soon { padding: 3rem 1.25rem 4rem; }
      .lb-stage { padding: 1rem 3rem; }
      #lb-prev { left: 0.375rem; }
      #lb-next { right: 0.375rem; }
    }
  </style>
</head>
<body>
  <div id="site-nav"></div>

  <!-- ═══════ PAGE HEADER ═══════ -->
  <header class="page-header">
    <div class="page-header-inner">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:0.5rem;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(196,168,130,0.65);text-decoration:none;margin-bottom:2rem;transition:color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='rgba(196,168,130,0.65)'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to Home
      </a>
      <p class="label">Our Portfolio</p>
      <h1 style="font-family:'Cormorant Garamond',serif;font-size:clamp(2.75rem,5vw,4.25rem);font-weight:300;line-height:1.08;letter-spacing:-0.03em;color:#fff;margin-bottom:1.25rem;">
        Every Space, <em style="color:var(--accent);font-style:italic;">Crafted</em> to Last
      </h1>
      <p style="font-size:1.0625rem;color:rgba(255,255,255,0.38);font-weight:300;max-width:500px;line-height:1.7;">
        Browse our work across kitchens, bathrooms, and built-in robes. Click any photo to explore in full.
      </p>
      <div class="cat-tabs" id="cat-tabs" role="tablist"></div>
    </div>
  </header>

  <!-- ═══════ MASONRY ═══════ -->
  <section class="masonry-section">
    <div style="max-width:1440px;margin:0 auto;">
      <div class="count-bar"><span class="count-text" id="count-label"></span></div>
      <div class="masonry-grid" id="masonry-grid"></div>
    </div>
  </section>

  <!-- ═══════ CTA ═══════ -->
  <div class="coming-soon">
    <p style="font-size:0.7rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;">More Coming Soon</p>
    <p style="font-size:1.0625rem;color:rgba(255,255,255,0.38);font-weight:300;max-width:420px;margin:0 auto 2.25rem;line-height:1.72;">We're documenting our latest installations. Check back soon — or start a conversation today.</p>
    <a href="contact.html" class="btn-gold" style="display:inline-flex;align-items:center;gap:0.625rem;">
      Start Your Project
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </a>
  </div>

  <div id="site-footer"></div>

  <!-- ═══════ LIGHTBOX ═══════ -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-bar">
      <span class="lb-count" id="lb-count"></span>
      <button class="lb-close-btn" id="lb-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="lb-stage">
      <img id="lb-img" src="" alt="" />
      <button class="lb-nav" id="lb-prev" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="lb-nav" id="lb-next" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="lb-strip" id="lb-strip"></div>
  </div>

  <script>
  // Preferred tab order
  const CAT_ORDER = ['kitchen', 'bathroom', 'builtin', 'commercial', 'office', 'robe', 'laundry'];

  let categories = []; // [{cat, label, photos:[]}]
  let lbPhotos = [], lbIdx = 0;

  // ── Load photo data: try live API first, fall back to static manifest ──
  async function loadData() {
    try {
      const r = await fetch('/api/photos', { cache: 'no-store' });
      if (r.ok) { categories = await r.json(); return; }
    } catch {}
    // Fallback: use photos-manifest.js (loaded via <script> tag above)
    if (typeof PHOTOS_MANIFEST !== 'undefined') categories = PHOTOS_MANIFEST;
  }

  // ── Build category tabs ──
  function buildTabs() {
    const tabsEl = document.getElementById('cat-tabs');
    tabsEl.innerHTML = '';
    const orderedCats = CAT_ORDER.filter(c => categories.some(x => x.cat === c));
    categories.forEach(c => { if (!orderedCats.includes(c.cat)) orderedCats.push(c.cat); });

    const makeTab = (cat, label) => {
      const btn = document.createElement('button');
      btn.className = 'cat-tab' + (cat === 'all' ? ' active' : '');
      btn.dataset.cat = cat; btn.textContent = label;
      tabsEl.appendChild(btn);
    };
    makeTab('all', 'All');
    orderedCats.forEach(cat => {
      makeTab(cat, categories.find(c => c.cat === cat)?.label || cat);
    });

    tabsEl.addEventListener('click', e => {
      const btn = e.target.closest('.cat-tab');
      if (!btn) return;
      tabsEl.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMasonry(btn.dataset.cat);
    });
  }

  // ── Render masonry grid ──
  function renderMasonry(filter) {
    const projects = filter === 'all'
      ? categories
      : categories.filter(c => c.cat === filter);

    // Flatten to individual photo items, each carrying its project title + full strip
    const photos = projects.flatMap(p =>
      p.photos.map(src => ({ src, cat: p.cat, title: p.title, strip: p.photos }))
    );

    document.getElementById('count-label').textContent =
      photos.length + ' photo' + (photos.length !== 1 ? 's' : '');

    const grid = document.getElementById('masonry-grid');
    grid.innerHTML = '';
    photos.forEach((photo, i) => {
      const item = document.createElement('div');
      item.className = 'masonry-item';
      item.innerHTML = `
        <img src="${photo.src}" alt="${photo.title}" loading="lazy" />
        <div class="m-overlay">
          <h3 class="m-title">${photo.title}</h3>
        </div>`;
      item.addEventListener('click', () => openLightbox(photos, i));
      grid.appendChild(item);
    });
  }

  // ── Lightbox — navigates through the full visible photo list ──
  function openLightbox(photos, startIdx) {
    lbPhotos = photos;
    lbIdx    = startIdx;
    syncLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function syncLightbox() {
    document.getElementById('lb-img').src = lbPhotos[lbIdx].src;
    document.getElementById('lb-count').textContent = (lbIdx + 1) + ' / ' + lbPhotos.length;
    document.getElementById('lb-prev').classList.toggle('dim', lbIdx === 0);
    document.getElementById('lb-next').classList.toggle('dim', lbIdx === lbPhotos.length - 1);

    const strip = document.getElementById('lb-strip');
    strip.innerHTML = lbPhotos.map((p, i) =>
      `<img class="lb-thumb${i === lbIdx ? ' active' : ''}" src="${p.src}" alt="" data-i="${i}" loading="lazy" />`
    ).join('');
    strip.querySelectorAll('.lb-thumb').forEach(t =>
      t.addEventListener('click', () => { lbIdx = +t.dataset.i; syncLightbox(); })
    );
    strip.querySelector('.lb-thumb.active')?.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => { if (lbIdx > 0) { lbIdx--; syncLightbox(); } });
  document.getElementById('lb-next').addEventListener('click', () => { if (lbIdx < lbPhotos.length - 1) { lbIdx++; syncLightbox(); } });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowLeft'  && lbIdx > 0)                        { lbIdx--; syncLightbox(); }
    if (e.key === 'ArrowRight' && lbIdx < lbPhotos.length - 1)      { lbIdx++; syncLightbox(); }
    if (e.key === 'Escape') closeLightbox();
  });

  // ── Init ──
  loadData().then(() => { buildTabs(); renderMasonry('all'); });
  </script>

  <script src="/site.js"></script>
</body>
</html>
